name: Build Kisa (APK + AAB)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Android 36 platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Bootstrap Gradle wrapper
        run: gradle wrapper --gradle-version 8.11.1

      # ---------- DIAGNOSA: hapus langkah ini setelah build berhasil ----------
      - name: Diagnose R class
        run: |
          echo "===== app/build.gradle (baris penting) ====="
          grep -nE "plugins|id '|namespace|applicationId|compileSdk|targetSdk" app/build.gradle || true
          echo
          echo "===== package di AndroidManifest.xml ====="
          grep -n "package=" app/src/main/AndroidManifest.xml || echo "(tidak ada atribut package - normal)"
          echo
          echo "===== semua file Kotlin/Java di repo ====="
          find app/src -name "*.kt" -o -name "*.java"
          echo
          echo "===== baris package di tiap file Kotlin ====="
          find app/src -name "*.kt" -exec grep -Hn "^package" {} \;
          echo
          ./gradlew :app:processDebugResources --quiet || echo "(processDebugResources gagal)"
          echo "===== lokasi class R yang dihasilkan ====="
          find app/build -name "R.jar" | while read f; do
            echo "-- $f"
            unzip -l "$f" | grep -E "/R\.class$" | head -5
          done
          echo
          echo "===== isi lengkap app/build.gradle ====="
          cat app/build.gradle
          echo
          echo "######################################################"
          echo "#  SALIN SEMUA TEKS DI ATAS INI DAN KIRIM KE CLAUDE   #"
          echo "######################################################"
          exit 1
      # -----------------------------------------------------------------------

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Decode keystore (for signed release)
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/kisa.jks"

      - name: Build signed release AAB
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/kisa.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Kisa-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release AAB
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Kisa-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/kisa.jks"
